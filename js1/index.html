<!DOCTYPE html>
<html>
<head>
    <title>JS Exercise 2</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 22px;
        }

        input {
            width: 280px;
            padding: 8px;
            font-size: 18px;
        }

        button {
            padding: 6px 12px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>JS Exercise 2</h1>

    <label>First Name:</label>
    <input type="text" id="firstName">
    <br><br>

    <label>Middle Name:</label>
    <input type="text" id="middleName">
    <br><br>

    <label>Last Name:</label>
    <input type="text" id="lastName">
    <br><br>

    <button onclick="generateFullname()">Generate Fullname</button>
    <button onclick="clearEntries()">Clear Entries</button>

    <p>Full Name: <span id="fullName"></span></p>

    <script>
        function generateFullname() {
            let first = document.getElementById("firstName").value.trim();
            let middle = document.getElementById("middleName").value.trim();
            let last = document.getElementById("lastName").value.trim();

            let fullname = [first, middle, last]
                .filter(name => name !== "")
                .join(" ");

            document.getElementById("fullName").textContent = fullname;
        }

        function clearEntries() {
            document.getElementById("firstName").value = "";
            document.getElementById("middleName").value = "";
            document.getElementById("lastName").value = "";
            document.getElementById("fullName").textContent = "";
        }
    </script>

</body>
</html>
