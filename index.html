```html
<!DOCTYPE html>
<html>
<head>
    <title>JS Exercise 1</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 22px;
        }

        input {
            width: 340px;
            padding: 8px;
            font-size: 18px;
        }

        button {
            padding: 6px 15px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>JS Exercise 1</h1>

    <label>Enter First Number:</label>
    <input type="number" id="num1">
    <br><br>

    <label>Enter Second Number:</label>
    <input type="number" id="num2">
    <br><br>

    <button onclick="calculate()">Calculate</button>
    <button onclick="clearEntries()">Clear</button>

    <p>Sum: <span id="sum"></span></p>
    <p>Difference: <span id="difference"></span></p>
    <p>Product: <span id="product"></span></p>
    <p>Quotient: <span id="quotient"></span></p>

    <script>
        function calculate() {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);

            if (isNaN(a) || isNaN(b)) {
                alert("Please enter both numbers.");
                return;
            }

            document.getElementById("sum").textContent = a + b;
            document.getElementById("difference").textContent = a - b;
            document.getElementById("product").textContent = a * b;

            if (b === 0) {
                document.getElementById("quotient").textContent =
                    "Cannot divide by zero";
            } else {
                document.getElementById("quotient").textContent = a / b;
            }
        }

        function clearEntries() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";

            document.getElementById("sum").textContent = "";
            document.getElementById("difference").textContent = "";
            document.getElementById("product").textContent = "";
            document.getElementById("quotient").textContent = "";
        }
    </script>

</body>
</html>
```
